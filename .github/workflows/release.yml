name: Release

# HACS installs and updates this integration from the latest GitHub *release*,
# not from commits on the default branch. Each `npm run export:ha` snapshot that
# bumps custom_components/printstream/manifest.json must therefore be published
# as a matching `v<version>` release, or HACS never sees the change.
#
# This runs on every push to main that touches the manifest, reads the version,
# and creates the release if one does not already exist. It is idempotent: a
# push whose version already has a release is a no-op, so re-running is safe.
#
# The Release body is release-notes/<version>.md, the approved notes written
# for users, followed by the AI disclosure line every release carries. A
# version with no notes file fails instead of publishing generated notes.
on:
  push:
    branches: [main]
    paths:
      - custom_components/printstream/manifest.json
  workflow_dispatch: {}

# Least privilege by default (CI-5): jobs that need more widen it at job level.
permissions:
  contents: read

# Publishes or files something: never cancel a run part-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 10
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read manifest version
        id: manifest
        run: |
          version="$(jq -r .version custom_components/printstream/manifest.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "manifest.json has no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi

          notes_file="release-notes/${VERSION}.md"
          if [ ! -s "$notes_file" ] || ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "No release notes for ${VERSION}: add ${notes_file}" >&2
            exit 1
          fi
          cp "$notes_file" notes.md
          printf '\n%s\n' '*AI disclosure: this release and the related code were written with the assistance of AI.*' >> notes.md

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PrintStream for Home Assistant ${VERSION}" \
            --notes-file notes.md

# Lives at .github/workflows/ in the exported printstream-home-assistant repo
# (inert inside the monorepo, where this directory is not the repo root).
# Standard checks for a HACS custom integration: Home Assistant's hassfest
# manifest validation plus HACS repository validation.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, catches breakage from new HA releases

# Least privilege by default (CI-5): jobs that need more widen it at job level.
permissions:
  contents: read

# A check: a newer run supersedes this one.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No release since 1.0.0 (2020) and Home Assistant documents the branch, so this
      # pins the branch head; refresh it by hand. The pin covers only the wrapper: it runs
      # the floating ghcr.io/home-assistant/hassfest image, so new HA rules still apply.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  hacs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Last release is 22.5.0 (2022) and HACS documents the branch, so this pins the
      # branch head; refresh it by hand. The pin covers only the wrapper: it runs the
      # floating ghcr.io/hacs/action:main image.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration
          # PolyForm Noncommercial 1.0.0 is not in GitHub's license database
          # (licensee reports NOASSERTION), so the HACS license check can
          # never pass; the repo does carry a full LICENSE + NOTICE. This is
          # a custom-repo integration, so the check is advisory here.
          ignore: license
